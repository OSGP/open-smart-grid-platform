name: Testing kubernetes cucumber test cluster
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    name: Testing kubernetes cucumber test cluster
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gxf-gitops
        uses: actions/checkout@v4
        with:
          repository: 'OSGP/gxf-gitops'
          #          TODO remove when gxf-gitops is fully operational
          ref: 'feature/FDP-2849-initial-setup-gitops'
      - name: Setup k3d cluster
        run: ./setup.sh
      - name: Echo starting
        run: echo "Generating app secrets"
      - name: Deleting old secrets
        run: kubectl delete --all secrets
      - name: Generating root key
        run: openssl genpkey -aes-256-cbc -pass pass:"test" -algorithm RSA -out "test" -pkeyopt rsa_keygen_bits:4096
      - name: Generating root cert
        run: openssl req -x509 -new -nodes -key test -passin pass:"test" -sha256 -days 365 -out test -subj "/C=NL/ST=Gelderland/L=Arnhem/O=LFEnergy/OU=IT/CN=Generated Root CA"