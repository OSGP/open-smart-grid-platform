name: Build analyse and push docker container
on:
  push:
    branches:
      - development
      - 'release-*'
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Set maven options for cucumber containers
        id: maven_options
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: echo 'maven_options=-DskipTestJarWithDependenciesAssembly=false' >> $GITHUB_OUTPUT
      - name: Build and analyse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -T2C -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=gxf -Dsonar.projectKey=OSGP_open-smart-grid-platform ${{ steps.maven_options.outputs.maven_options }}

        # Upload war and jar files

      - name: Upload osgp-core
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-core
          path: osgp/platform/osgp-core/

      - name: Upload osgp-logging
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-logging
          path: osgp/platform/osgp-logging/

      - name: Upload osgp-adapter-domain-admin
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-domain-admin
          path: osgp/platform/osgp-adapter-domain-admin/

      - name: Upload osgp-adapter-domain-core
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-domain-core
          path: osgp/platform/osgp-adapter-domain-core/

      - name: Upload osgp-adapter-domain-publiclighting
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-domain-publiclighting
          path: osgp/platform/osgp-adapter-domain-publiclighting/

      - name: Upload osgp-adapter-domain-smartmetering
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-domain-smartmetering
          path: osgp/platform/osgp-adapter-domain-smartmetering/

      - name: Upload osgp-adapter-domain-tariffswitching
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-domain-tariffswitching
          path: osgp/platform/osgp-adapter-domain-tariffswitching/

      - name: Upload osgp-adapter-ws-admin
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-ws-admin
          path: osgp/platform/osgp-adapter-ws-admin/

      - name: Upload osgp-adapter-ws-core
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-ws-core
          path: osgp/platform/osgp-adapter-ws-core/

      - name: Upload osgp-adapter-ws-publiclighting
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-ws-publiclighting
          path: osgp/platform/osgp-adapter-ws-publiclighting/

      - name: Upload osgp-adapter-ws-smartmetering
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-ws-smartmetering
          path: osgp/platform/osgp-adapter-ws-smartmetering/

      - name: Upload osgp-adapter-ws-tariffswitching
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-adapter-ws-tariffswitching
          path: osgp/platform/osgp-adapter-ws-tariffswitching/

      - name: Upload osgp-protocol-adapter-iec60870
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-protocol-adapter-iec60870
          path: osgp/protocol-adapter-iec60870/osgp-protocol-adapter-iec60870/

      - name: Upload osgp-protocol-adapter-iec61850
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-protocol-adapter-iec61850
          path: osgp/protocol-adapter-iec61850/osgp-protocol-adapter-iec61850/

      - name: Upload osgp-protocol-adapter-oslp-elster
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-protocol-adapter-oslp-elster
          path: osgp/protocol-adapter-oslp/osgp-protocol-adapter-oslp-elster/

      - name: Upload signing-server
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: signing-server
          path: osgp/protocol-adapter-oslp/signing-server/

      - name: Find and copy osgp-protocol-simulator-iec60870 war
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: |
          mkdir -p osgp-protocol-simulator-iec60870
          find osgp/protocol-adapter-iec60870/osgp-protocol-simulator-iec60870/target -name 'osgp-protocol-simulator-iec60870-*.war' -exec cp --parents '{}' osgp-protocol-simulator-iec60870/ \;
      - name: Upload osgp-protocol-simulator-iec60870
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-protocol-simulator-iec60870
          path: osgp-protocol-simulator-iec60870

      - name: Find and copy web-device-simulator war
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: |
          mkdir -p web-device-simulator
          find osgp/protocol-adapter-oslp/web-device-simulator/target -name 'web-device-simulator-*.war' -exec cp --parents '{}' web-device-simulator/ \;
      - name: Upload web-device-simulator
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: web-device-simulator
          path: web-device-simulator

      - name: Find and copy osgp-protocol-simulator-iec61850 war
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: |
          mkdir -p osgp-protocol-simulator-iec61850
          find osgp/protocol-adapter-iec61850/osgp-protocol-simulator-iec61850/target -name 'osgp-protocol-simulator-iec61850-*.war' -exec cp --parents '{}' osgp-protocol-simulator-iec61850/ \;
      - name: Upload osgp-protocol-simulator-iec61850
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: osgp-protocol-simulator-iec61850
          path: osgp-protocol-simulator-iec61850

      - name: Find and copy cucumber-tests-platform-common jar
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: |
          mkdir -p cucumber-tests-platform-common
          find integration-tests/cucumber-tests-platform-common/target -name 'cucumber-tests-platform-common-*-test-jar-with-dependencies.jar' -exec cp --parents '{}' cucumber-tests-platform-common/ \;
      - name: Upload cucumber-tests-platform-common
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-tests-platform-common
          path: cucumber-tests-platform-common

      - name: Find and copy cucumber-tests-platform-publiclighting jar
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: |
          mkdir -p cucumber-tests-platform-publiclighting
          find integration-tests/cucumber-tests-platform-publiclighting/target -name 'cucumber-tests-platform-publiclighting-*-test-jar-with-dependencies.jar' -exec cp --parents '{}' cucumber-tests-platform-publiclighting/ \;
      - name: Upload cucumber-tests-platform-publiclighting
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-tests-platform-publiclighting
          path: cucumber-tests-platform-publiclighting

      - name: Find and copy cucumber-tests-platform-smartmetering jar
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        run: |
          mkdir -p cucumber-tests-platform-smartmetering
          find integration-tests/cucumber-tests-platform-smartmetering/target -name 'cucumber-tests-platform-smartmetering-*-test-jar-with-dependencies.jar' -exec cp --parents '{}' cucumber-tests-platform-smartmetering/ \;
      - name: Upload cucumber-tests-platform-smartmetering
        if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-tests-platform-smartmetering
          path: cucumber-tests-platform-smartmetering

  docker:
    name: Building docker images
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'build_containers') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
    needs: build
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/osgp/osgp-core
            artifact: osgp-core
            context: ./osgp/platform/osgp-core/
          - image: ghcr.io/osgp/osgp-logging
            artifact: osgp-logging
            context: ./osgp/platform/osgp-logging/
          - image: ghcr.io/osgp/osgp-adapter-domain-admin
            artifact: osgp-adapter-domain-admin
            context: ./osgp/platform/osgp-adapter-domain-admin/
          - image: ghcr.io/osgp/osgp-adapter-domain-core
            artifact: osgp-adapter-domain-core
            context: ./osgp/platform/osgp-adapter-domain-core/
          - image: ghcr.io/osgp/osgp-adapter-domain-publiclighting
            artifact: osgp-adapter-domain-publiclighting
            context: ./osgp/platform/osgp-adapter-domain-publiclighting/
          - image: ghcr.io/osgp/osgp-adapter-domain-smartmetering
            artifact: osgp-adapter-domain-smartmetering
            context: ./osgp/platform/osgp-adapter-domain-smartmetering/
          - image: ghcr.io/osgp/osgp-adapter-domain-tariffswitching
            artifact: osgp-adapter-domain-tariffswitching
            context: ./osgp/platform/osgp-adapter-domain-tariffswitching/
          - image: ghcr.io/osgp/osgp-adapter-ws-admin
            artifact: osgp-adapter-ws-admin
            context: ./osgp/platform/osgp-adapter-ws-admin/
          - image: ghcr.io/osgp/osgp-adapter-ws-core
            artifact: osgp-adapter-ws-core
            context: ./osgp/platform/osgp-adapter-ws-core/
          - image: ghcr.io/osgp/osgp-adapter-ws-publiclighting
            artifact: osgp-adapter-ws-publiclighting
            context: ./osgp/platform/osgp-adapter-ws-publiclighting/
          - image: ghcr.io/osgp/osgp-adapter-ws-smartmetering
            artifact: osgp-adapter-ws-smartmetering
            context: ./osgp/platform/osgp-adapter-ws-smartmetering/
          - image: ghcr.io/osgp/osgp-adapter-ws-tariffswitching
            artifact: osgp-adapter-ws-tariffswitching
            context: ./osgp/platform/osgp-adapter-ws-tariffswitching/
          - image: ghcr.io/osgp/osgp-protocol-adapter-iec60870
            artifact: osgp-protocol-adapter-iec60870
            context: ./osgp/protocol-adapter-iec60870/osgp-protocol-adapter-iec60870
          - image: ghcr.io/osgp/osgp-protocol-simulator-iec60870
            artifact: osgp-protocol-simulator-iec60870
            context: ./osgp/protocol-adapter-iec60870/osgp-protocol-simulator-iec60870
          - image: ghcr.io/osgp/osgp-protocol-adapter-iec61850
            artifact: osgp-protocol-adapter-iec61850
            context: ./osgp/protocol-adapter-iec61850/osgp-protocol-adapter-iec61850
          - image: ghcr.io/osgp/osgp-protocol-simulator-iec61850
            artifact: osgp-protocol-simulator-iec61850
            context: ./osgp/protocol-adapter-iec61850/osgp-protocol-simulator-iec61850
          - image: ghcr.io/osgp/osgp-protocol-adapter-oslp
            artifact: osgp-protocol-adapter-oslp-elster
            context: ./osgp/protocol-adapter-oslp/osgp-protocol-adapter-oslp-elster
          - image: ghcr.io/osgp/osgp-signing-server
            artifact: signing-server
            context: ./osgp/protocol-adapter-oslp/signing-server
          - image: ghcr.io/osgp/osgp-web-device-simulator
            artifact: web-device-simulator
            context: ./osgp/protocol-adapter-oslp/web-device-simulator
          - image: ghcr.io/osgp/osgp-cucumber-tests-platform-common
            artifact: cucumber-tests-platform-common
            context: ./integration-tests/cucumber-tests-platform-common
          - image: ghcr.io/osgp/osgp-cucumber-tests-platform-publiclighting
            artifact: cucumber-tests-platform-publiclighting
            context: ./integration-tests/cucumber-tests-platform-publiclighting
          - image: ghcr.io/osgp/osgp-cucumber-tests-platform-smartmetering
            artifact: cucumber-tests-platform-smartmetering
            context: ./integration-tests/cucumber-tests-platform-smartmetering
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download war files
        uses: actions/download-artifact@v4
        with:
          path: ${{ matrix.context }}
          name: ${{ matrix.artifact }}
      - name: Show files in current context
        run: find ${{ matrix.context }}
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Maven project version
        if: contains(github.ref, 'release') || contains(github.ref, 'development')
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT
        id: maven
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=schedule
            type=semver,pattern={{version}},value=${{ steps.maven.outputs.version }}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}

  cucumber:
    name: Running cucumber gxf containers
    runs-on: ubuntu-latest
    if: contains(github.ref, 'release') || contains(github.ref, 'development') || contains(github.event.pull_request.labels.*.name, 'cucumber_testing')
    needs: docker
    permissions:
      checks: write
    strategy:
      matrix:
        values_file: [ci/common-values.yaml, ci/publiclighting-values.yaml]
    steps:
      - name: Checkout gxf-gitops
        uses: actions/checkout@v4
        with:
          repository: 'OSGP/gxf-gitops'
      - name: Setup k3d cluster
        run: bash setup.sh
      - name: Create gxf platform
        run: ./charts/gxf-platform/template-apply.sh --imageTag $(echo -e "${{ needs.docker.outputs.tags }}" | head -n 1 | cut -d':' -f2)
      - name: Create and run gxf cucumber tests
        run: ./charts/gxf-cucumber-tests/template-apply.sh --imageTag $(echo -e "${{ needs.docker.outputs.tags }}" | head -n 1 | cut -d':' -f2) --valuesFile ${{ matrix.values_file }}
      - name: Wait for jobs to finish
        run: kubectl wait --for=condition=complete --all jobs --timeout=30m
      - name: Run maven cucumber reporting
        run: mvn -f charts/gxf-cucumber-tests/pom.xml verify
      - name: Annotate cucumber report to github action
        uses: deblockt/cucumber-report-annotations-action@v1.7
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "/tmp/k3dvolume/**/*.json"

